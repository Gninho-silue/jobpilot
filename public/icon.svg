<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- Subtle dynamic speed lines / radar trail -->
  <path d="M28 88 Q 50 78, 64 64" stroke="url(#trailGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M36 98 Q 58 88, 72 74" stroke="url(#trailGrad)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Supersonic Pilot Jet / Plane Symbol -->
  <g transform="translate(6, 6)">
    <!-- Shadow / Glow -->
    <path d="M88.5 27.5 C89.5 24 87 21.5 83.5 22.5 L24 45 C20 46.5 20.5 52 25 53.5 L50 62 L58.5 87 C60 91.5 65.5 92 67 88 L89.5 28.5 Z" 
          fill="#f59e0b" opacity="0.2" filter="url(#glow)" />
    
    <!-- Main Plane Body -->
    <path d="M88.5 27.5 C89.5 24 87 21.5 83.5 22.5 L24 45 C20 46.5 20.5 52 25 53.5 L50 62 L58.5 87 C60 91.5 65.5 92 67 88 L89.5 28.5 Z" 
          fill="url(#planeGrad)" />
    
    <!-- Wing Fold / Shading for depth -->
    <path d="M50 62 L86 25 L58.5 87 Z" 
          fill="#d97706" opacity="0.6" />

    <!-- Center fuselage highlight line -->
    <path d="M50 62 L87 24" 
          stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
