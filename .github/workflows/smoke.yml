name: Production smoke test

# Vercel reports each deployment to GitHub; this runs once a production
# deployment has succeeded. Home page, public URLs, and a demo workspace opened,
# shown on the dashboard and deleted: no AI call, no billing call.
on:
  deployment_status:

jobs:
  smoke:
    name: Smoke test (production)
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/smoke-production.mjs https://jobpilot-jet.vercel.app
