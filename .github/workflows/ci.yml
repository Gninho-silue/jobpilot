name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service database. Integration tests refuse non-local hosts.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Needs the Clerk test secrets: pushes, and pull requests from this repository (not forks).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobpilot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      # Throwaway service database; playwright.config.ts refuses a non-local one.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_e2e
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      DEMO_COOKIE_SECRET: e2e-demo-cookie-secret-0123456789abcdef
      NEXT_PUBLIC_CLERK_TELEMETRY_DISABLED: '1'
      # Clerk development instance (test keys) and the test account's password: GitHub secrets.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CLERK_PASSWORD: ${{ secrets.E2E_CLERK_PASSWORD }}
      # The E2E tests never call Groq, Stripe or Supabase: placeholders only.
      GROQ_API_KEY: gsk_e2e_unused
      STRIPE_SECRET_KEY: sk_test_e2e_unused
      STRIPE_WEBHOOK_SECRET: whsec_e2e_unused
      STRIPE_PRO_PRICE_ID: price_e2e_unused
      NEXT_PUBLIC_SUPABASE_URL: https://e2e-unused.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e_unused
      SUPABASE_SERVICE_ROLE_KEY: e2e_unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      # The migrations themselves are tested here, on an empty database.
      - run: npx prisma migrate deploy
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npx playwright test
      - name: Screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test]
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      CLERK_SECRET_KEY: sk_test_dummy
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      GROQ_API_KEY: gsk_dummy
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      STRIPE_PRO_PRICE_ID: price_dummy
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key
      SUPABASE_SERVICE_ROLE_KEY: dummy_service_key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  supabase-security:
    name: Supabase Security (public buckets, RLS)
    runs-on: ubuntu-latest
    # Reads the production project's bucket list and Postgres catalog (no table data).
    # Only on pushes to main: never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_AUDIT_DB_URL: ${{ secrets.SUPABASE_AUDIT_DB_URL }}
      SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: node scripts/check-supabase-security.mjs
